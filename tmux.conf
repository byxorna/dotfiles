# Charmtone Pantera palette (Crush)
#
#   #6B50FF  Charple   primary indigo
#   #4A30D9  Jelly     dark indigo
#   #8B75FF  Hazy      light indigo
#   #FF60FF  Dolly     magenta
#   #FF577D  Coral     red/error
#   #FF985A  Tang      orange/attention
#   #00A4FF  Malibu    blue/info
#   #00FFB2  Julep     green/success
#   #ECEBF0  Sash      foreground
#   #858392  Squid     subtle text
#   #605F6B  Oyster    dim text
#   #3A3943  Char      border
#   #2D2C36  BBQ       dark bg
#   #201F26  Pepper    darkest bg
#   #4D4C57  Iron      muted
#
#   Full swatch preview: tmux/charmtone-swatches.sh

# Switch me back to ^A, thanks
set-option -g prefix C-a
unbind-key C-b
bind-key a send-prefix

# scrolling in the window? maybe? please?
#set -g terminal-overrides 'xterm*:smcup@:rmcup@'
# neovim suggestion for truecolors
set-option -sa terminal-overrides ',XXX:RGB'

# I miss ^A^A
bind-key C-a last-window

# Reload tmux config with r
bind r source-file ~/.tmux.conf

# layout toggling
bind-key Space next-layout
bind-key C-Space previous-layout
bind-key = select-layout tiled

# vim style pane selections
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# synchronize-panes
bind m set -w synchronize-panes

# allow breaking pane(split) into fullscreen
bind-key + break-pane
# join the current pane to a target window (requires number)
bind-key - command-prompt -p "send pane to window:"  "join-pane -t '%%'"

# swap panes side by side
#bind-key { swap-pane -U
#bind-key } swap-pane -D

# show messages from tmux
#bind-key ~ show-messages
# zoom current pane fullscreen (toggle)
bind-key z resize-pane -Z

# Options
set-option -sg escape-time 50  # this makes vim fucking awful to use
set-option -g base-index 1
set-option -g default-terminal screen-256color
set-option -g lock-command vlock
set-window-option -g xterm-keys on  # to make ctrl-arrow, etc. work
#monitor window activity
setw -g monitor-activity on
set -g visual-activity on
#allow auto renaming
setw -g automatic-rename on
#setw -g utf8 on  # no longer necessary in HEAD
set -g history-limit 10000


##+ messages:
set-window-option -g mode-style bg=default,fg='#FF60FF'
set-window-option -g message-style bg=default,fg='#FF60FF'

##+ panes:
set-option -g pane-border-style fg='#3A3943',bg=default
set-option -g pane-active-border-style fg='#6B50FF',bg=default

##+ status bar:

set-option -g status-position top
set-option -g set-titles on
set-option -g set-titles-string '#T'

#set-option -g status-utf8 on  # no longer necessary in HEAD
set-option -g status-interval 3 # this impacts update interval for status bar, and clobbers messages
set-option -g status-left-length 60
set-option -g status-right-length 600
set-option -g status-justify left
set-option -g status-style bg=default,fg='#605F6B'
set-option -g visual-activity on
set-window-option -g monitor-activity on
set-window-option -g window-status-current-style bg='#2D2C36',fg='#ECEBF0'
#set-window-option -g window-status-current-fg '#3d3a3a'
#set-window-option -g window-status-current-fg 'colour25' # ice blue
set-window-option -g window-status-style bg=default,fg='#605F6B'
set-window-option -g window-status-activity-style bg=default,fg='#00FFB2'

##+ clock:
set-window-option -g clock-mode-colour '#8B75FF'
set-window-option -g clock-mode-style 24 # hours

# window tab format for unfocused tabs
set-option -g window-status-separator ''
set-option -g window-status-format '#{?window_activity_flag,#[fg=#00FFB2],#[fg=#FF985A]}#[bg=default] #I#{?window_activity_flag,#[fg=#00FFB2]!,} #[fg=#858392,bg=default]#W#F '
# window tab format for focused tabs (keep in mind, status-right shows #W)
set-option -g window-status-current-format '#[fg=#ECEBF0,bg=#6B50FF] #I #[fg=#ECEBF0,bg=#4A30D9] #W#F '

set-option -g status-left '#I.#P '
set-option -g status-right "#{?#{>=:#{window_width},140},#[fg=#858392]#T ,}#{?#{>=:#{window_width},160},#[fg=#00A4FF]#(type -p kubectl >/dev/null && test -r ~/.kube/config && kubectl config current-context)#[default] ,}#{?#{>=:#{window_width},180},#[fg=#FF60FF]#h#[default] ,}#{?#{online_status},#{online_status} ,}#{?#{ram_percentage},#{ram_fg_color}#{ram_icon}#{ram_percentage} ,}#{?#{cpu_percentage},#{cpu_fg_color}#{cpu_icon}#{cpu_percentage} ,}#{?#{battery_percentage},#[fg=default,bg=default]#{battery_color_bg}#{battery_color_fg} #{battery_percentage} #{battery_icon_status}#[default] ,}#[fg=#6B50FF]%Y.#[fg=#FF577D]%m.%d #[fg=#FF985A]%H:%M:%S#[default]"

# colorscheme: charmtone pantera (Crush)
set -g @cpu_low_fg_color "#[fg=#4D4C57]"
set -g @cpu_medium_fg_color "#[fg=#00A4FF]"
set -g @cpu_high_fg_color "#[fg=#FF577D]"
set -g @ram_low_fg_color "#[fg=#4D4C57]"
set -g @ram_medium_fg_color "#[fg=#00A4FF]"
set -g @ram_high_fg_color "#[fg=#FF577D]"
set -g @online_icon "online"
set -g @offline_icon "offline"

# https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#run -b '~/.tmux/plugins/tpm/tpm'
